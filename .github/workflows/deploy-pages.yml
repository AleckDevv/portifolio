# Publica o portfólio no GitHub Pages a cada push na branch main.
# Requisito: em Settings → Pages, escolha "Source: GitHub Actions".
#
# Repositório AleckDevv.github.io (site de usuário) → deixe BASE_PATH como "/".
# Outro nome de repositório (site de projeto)       → use BASE_PATH: "/<nome-do-repo>/".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: "/"
      VITE_SITE_URL: "https://aleckdevv.github.io"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
